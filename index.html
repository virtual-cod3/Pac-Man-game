<!DOCTYPE html>
<html>
<head>
    <title>Mini Pacman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="score">Score: 0</h1>
    <h2 id="level">Level: 1</h2>

        <p id="popup-text"></p>
        <button id="popup-button" onclick="restartGame()">Restart</button>

    <script src="script.js"></script>
</body>
</html>
