<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Pac-Man Ultimate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-wrapper">

        <!-- TOP BAR -->
        <header class="top-bar">

            <div class="stat">
                <span class="label">SCORE</span>
                <span id="score">0</span>
            </div>

            <div class="game-title">
                <span>PAC</span><span>MAN</span>
            </div>

            <div class="stat">
                <span class="label">HIGH SCORE</span>
                <span id="highScore">0</span>
            </div>

        </header>


        <!-- LEVEL / LIVES -->
        <div class="level-bar">

            <span id="level">LEVEL 1</span>

            <span id="lives">❤️ ❤️ ❤️</span>

        </div>


        <!-- GAME -->
        <section class="game-container">

            <canvas id="game"></canvas>


            <!-- MESSAGE SCREEN -->
            <div id="message" class="message hidden">

                <div class="message-box">

                    <div class="arcade-decoration">
                        <span class="mini-pacman"></span>
                        <span class="mini-ghost red"></span>
                        <span class="mini-ghost pink"></span>
                        <span class="mini-ghost cyan"></span>
                    </div>

                    <h2 id="messageTitle">PAC-MAN</h2>

                    <p id="messageText">
                        Eat every pellet, collect power pellets and avoid the ghosts!
                    </p>

                    <div id="messageStats" class="message-stats hidden">

                        <div>
                            <span>FINAL SCORE</span>
                            <strong id="finalScore">0</strong>
                        </div>

                        <div>
                            <span>LEVEL</span>
                            <strong id="finalLevel">1</strong>
                        </div>

                    </div>

                    <div id="newHighScore" class="new-high-score hidden">
                        ★ NEW HIGH SCORE ★
                    </div>

                    <button id="messageButton">
                        START GAME
                    </button>

                </div>

            </div>

        </section>


        <!-- GAME BUTTONS -->
        <div class="game-buttons">

            <button id="pauseButton">
                ⏸ PAUSE
            </button>

            <button id="restartButton">
                ↻ RESTART
            </button>

        </div>


        <!-- MOBILE CONTROLS -->
        <div id="controls">

            <button class="control up"
                data-direction="up">
                ▲
            </button>

            <div class="middle-controls">

                <button class="control"
                    data-direction="left">
                    ◀
                </button>

                <button class="control"
                    data-direction="down">
                    ▼
                </button>

                <button class="control"
                    data-direction="right">
                    ▶
                </button>

            </div>

        </div>


        <p class="help">
            Desktop: Arrow Keys / WASD
            &nbsp; • &nbsp;
            Mobile: Touch Controls
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
